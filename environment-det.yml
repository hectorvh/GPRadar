# Detection experiment environment (YOLO / PyTorch).
# Ultralytics is AGPL-3.0: https://github.com/ultralytics/ultralytics
# PyTorch CUDA 12.4 wheels still support Pascal (sm_61 / Quadro P1000).
# Create with:
#   conda env create -f environment-det.yml
#   conda activate gprdet
#   pip install --index-url https://download.pytorch.org/whl/cu124 torch==2.6.0+cu124 torchvision==0.21.0+cu124
#   pip install -r requirements-det.txt
name: gprdet
channels:
  - conda-forge
dependencies:
  - python=3.11.18
  - pip=26.2.2
  - pip:
      - --index-url https://download.pytorch.org/whl/cu124
      - --extra-index-url https://pypi.org/simple
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - ultralytics==8.4.204
      - numpy==2.4.6
      - pandas==3.1.1
      - matplotlib==3.11.2
      - pillow==13.0.0
      - pyyaml==6.0.3
      - pytest==9.2.0
      - opencv-python==5.0.0.93
      - onnx==1.23.2
      - onnxruntime==1.31.1
      - onnxslim==0.1.98
      - sympy==1.13.1
